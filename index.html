
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bystřicko na nástěnce | Místní nabídky a aktivity</title>
    <meta name="description" content="Objevte kroužky, pohybové aktivity, akce a místní nabídky na Bystřicku. Vše přehledně na jednom místě.">

    <link rel="stylesheet" href="style.css">
    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

    <!-- ÚVODNÍ HLAVIČKA -->
    <header class="hero">
        <div class="hero-content">
            <div class="hero-box">
                <h1>Bystřicko<br>na nástěnce</h1>

                <p>
                    Objevte, co nabízí vaše okolí.
                    Kroužky, pohyb, akce a místní nabídky
                    přehledně na jednom místě.
                </p>
            </div>
        </div>
    </header>

    <main>

        <!-- KARUSEL: POHYB A KROUŽKY -->
        <section class="offers-section" aria-labelledby="movement-title">
            <div class="section-heading">
                <h2 id="movement-title">Pohyb a kroužky</h2>
                <p>Najděte aktivitu, která vás bude bavit.</p>
            </div>

                <div class="carousel" data-carousel data-category="pohyb">
                    <button class="carousel-button prev"
                        type="button"
                        aria-label="Předchozí nabídky">
                    &#10094;
                </button>

                <div class="carousel-window">
                    <div class="carousel-track">

                    </div>
                </div>

                <button class="carousel-button next"
                        type="button"
                        aria-label="Další nabídky">
                    &#10095;
                </button>
            </div>
        </section>


        <!-- KARUSEL: MÍSTNÍ NABÍDKA -->
        <section class="offers-section" aria-labelledby="local-title">
            <div class="section-heading">
                <h2 id="local-title">Místní nabídka</h2>
                <p>Objevte, co zajímavého vzniká a nabízí se u nás.</p>
            </div>

            <div class="carousel" data-carousel data-category="nabidka">
                <button class="carousel-button prev"
                        type="button"
                        aria-label="Předchozí nabídky">
                    &#10094;
                </button>

                <div class="carousel-window">
                    <div class="carousel-track">

                    </div>
                </div>

                <button class="carousel-button next"
                        type="button"
                        aria-label="Další nabídky">
                    &#10095;
                </button>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>Bystřicko na nástěnce · Místní nabídky na jednom místě.</p>
    </footer>

</body>
</html>
